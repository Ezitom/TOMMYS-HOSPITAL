<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Admin - TOMMY'S HOSPITAL</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script>
        (function() {
  const token = localStorage.getItem('jph_token');
  const role = localStorage.getItem('jph_role');
  // Only redirect if both token AND role are completely missing
  // Do not redirect on role mismatch alone without verifying with server
  if (!token) {
    window.location.href = '/dashboards/auth/login.html';
  } else if (role && role !== 'admin') {
    window.location.href = '/dashboards/auth/login.html';
  }
})();
        (function() { const t=localStorage.getItem('jph-theme'); if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark'); })();
    </script>
</head>
<body>
<div class="dashboard-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span class="sidebar-brand-name">TOMMY'S HOSPITAL</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="sidebar-link" id="nav-overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg><span>Overview</span></a></li>
            <li><a href="patients.html" class="sidebar-link" id="nav-patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg><span>Patients</span></a></li>
            <li><a href="doctors.html" class="sidebar-link" id="nav-doctors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg><span>Doctors</span></a></li>
            <li><a href="assignments.html" class="sidebar-link" id="nav-assignments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><span>Assignments</span></a></li>
            <li><a href="appointments.html" class="sidebar-link" id="nav-appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>Appointments</span></a></li>
            <li><a href="users.html" class="sidebar-link" id="nav-users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 1 0-16 0"></path></svg><span>Users</span></a></li>
            <li style="margin-top:auto;"><a class="sidebar-link" id="nav-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Logout</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="sidebar-avatar" id="user-avatar-initials">A</div>
            <div class="sidebar-user-info"><span class="sidebar-username" id="user-display-name">Admin</span><span class="sidebar-role-badge">Admin</span></div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="sidebar-toggle-btn" id="sidebar-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
                <h1 class="page-title">Doctors</h1>
            </div>
            <div class="top-bar-right">
                <button id="theme-toggle" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);margin-right:8px;"></button>
                <div style="position:relative;">
                    <button class="notification-bell-btn" id="bell-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="notification-badge" id="unread-count" style="display:none;">0</span></button>
                    <div class="notifications-dropdown-panel" id="notifications-panel"><div class="notifications-header"><span>Notifications</span><span class="mark-read-link" id="mark-all-read">Mark all as read</span></div><ul class="notifications-list" id="notifications-list-container"><li class="notification-empty-state">Loading...</li></ul></div>
                </div>
                <div class="user-menu-dropdown">
                    <div class="user-profile-trigger" id="profile-dropdown-trigger"><div class="avatar-placeholder" id="topbar-avatar-initials">A</div></div>
                    <ul class="profile-dropdown-list" id="profile-dropdown"><li class="profile-dropdown-item" id="logout-btn-dropdown">Logout</li></ul>
                </div>
            </div>
        </header>

        <div class="content-body">
            <div class="dashboard-panel">
                <div class="panel-header">
                    <h2>Medical Staff</h2>
                    <button class="btn btn-primary" id="open-add-doctor-btn">Add New Doctor</button>
                </div>
                <div class="table-wrapper">
                    <table class="custom-table" id="doctors-table">
                        <thead>
                            <tr>
                                <th>Full Name</th>
                                <th>Specialty</th>
                                <th>Qualifications</th>
                                <th>Experience</th>
                                <th>Patients</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Add Doctor Modal -->
<div class="modal-overlay" id="add-doctor-modal">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Create Doctor Account</h3>
            <button class="modal-close-btn" id="close-add-doctor-modal">&times;</button>
        </div>
        <form id="add-doctor-form">
            <div class="form-row">
                <div class="form-group"><label for="doc-fullname">Full Name</label><input type="text" id="doc-fullname" class="form-control" required></div>
                <div class="form-group"><label for="doc-email">Email Address</label><input type="email" id="doc-email" class="form-control" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label for="doc-phone">Phone Number</label><input type="tel" id="doc-phone" class="form-control"></div>
                <div class="form-group"><label for="doc-specialty">Specialty</label><input type="text" id="doc-specialty" class="form-control" placeholder="e.g. Cardiologist" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label for="doc-qualification">Qualifications</label><input type="text" id="doc-qualification" class="form-control" placeholder="e.g. MBBS, FMCP"></div>
                <div class="form-group"><label for="doc-experience">Years of Experience</label><input type="number" id="doc-experience" class="form-control" min="0"></div>
            </div>
            <div class="form-group"><label for="doc-password">Temporary Password</label><input type="password" id="doc-password" class="form-control" placeholder="Min 8 characters" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">Create Doctor Account</button>
        </form>
    </div>
</div>

<script src="../../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
