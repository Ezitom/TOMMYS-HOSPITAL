    <script>
        (function() {
  const token = localStorage.getItem('jph_token');
  const role = localStorage.getItem('jph_role');
  // Only redirect if both token AND role are completely missing
  // Do not redirect on role mismatch alone without verifying with server
  if (!token) {
    window.location.href = '/dashboards/auth/login.html';
  } else if (role && role !== 'doctor') {
    window.location.href = '/dashboards/auth/login.html';
  }
})();

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">

                <h1 class="page-title">Appointments</h1>
            </div>
            <div class="top-bar-right">
                <button id="theme-toggle" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);margin-right:8px;"></button>
                <div style="position:relative;">
                    <button class="notification-bell-btn" id="bell-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="notification-badge" id="unread-count" style="display:none;">0</span>
                    </button>
                    <div class="notifications-dropdown-panel" id="notifications-panel">
                        <div class="notifications-header"><span>Notifications</span><span class="mark-read-link" id="mark-all-read">Mark all as read</span></div>
                        <ul class="notifications-list" id="notifications-list-container"><li class="notification-empty-state">Loading...</li></ul>
                    </div>
                </div>
                <div class="user-menu-dropdown">
                    <div class="user-profile-trigger" id="profile-dropdown-trigger">
                        <div class="avatar-placeholder" id="topbar-avatar-initials">D</div>
                    </div>
                    <ul class="profile-dropdown-list" id="profile-dropdown">
                        <li class="profile-dropdown-item"><a href="profile.html">My Profile</a></li>
                        <li class="profile-dropdown-item" id="logout-btn-dropdown">Logout</li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="content-body">
            <div class="dashboard-panel">
                <div class="panel-header">
                    <h2>Appointment Schedule</h2>
                </div>
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all">All</button>
                    <button class="tab-btn" data-filter="today">Today</button>
                    <button class="tab-btn" data-filter="upcoming">Upcoming</button>
                    <button class="tab-btn" data-filter="completed">Completed</button>
                    <button class="tab-btn" data-filter="cancelled">Cancelled</button>
                </div>
                <div class="table-wrapper">
                    <table class="custom-table" id="appointments-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Patient</th>
                                <th>Reason</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

</div>

<!-- Notes Modal -->
<div class="modal-overlay" id="notes-modal">
    <div class="modal-container" style="max-width:400px;">
        <div class="modal-header">
            <h3>Add Clinical Notes</h3>
            <button class="modal-close-btn" id="close-notes-modal">&times;</button>
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea id="appointment-notes-input" class="form-control" rows="5" placeholder="Enter clinical notes..."></textarea>
        </div>
        <input type="hidden" id="notes-appointment-id">
        <button class="btn btn-primary" id="save-notes-btn" style="width:100%;">Save Notes</button>
    </div>
</div>
