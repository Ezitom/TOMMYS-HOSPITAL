# Netlify Configuration for TOMMY'S HOSPITAL Frontend

[build]
  # Publish the project root directory where HTML, CSS, JS, and dashboards reside
  publish = "."

# Dashboard direct route rewrites to avoid 404s on page refresh
[[redirects]]
  from = "/dashboards/admin"
  to = "/dashboards/admin/index.html"
  status = 200

[[redirects]]
  from = "/dashboards/admin/"
  to = "/dashboards/admin/index.html"
  status = 200

[[redirects]]
  from = "/dashboards/doctor"
  to = "/dashboards/doctor/index.html"
  status = 200

[[redirects]]
  from = "/dashboards/doctor/"
  to = "/dashboards/doctor/index.html"
  status = 200

[[redirects]]
  from = "/dashboards/patient"
  to = "/dashboards/patient/index.html"
  status = 200

[[redirects]]
  from = "/dashboards/patient/"
  to = "/dashboards/patient/index.html"
  status = 200

[[redirects]]
  from = "/dashboards/auth/login"
  to = "/dashboards/auth/login.html"
  status = 200

[[redirects]]
  from = "/dashboards/auth/register"
  to = "/dashboards/auth/register.html"
  status = 200

# Optional API Proxy redirect rule:
# If you prefer to proxy API requests through Netlify instead of direct CORS requests,
# replace YOUR-RENDER-APP-NAME with your live Render app name and uncomment below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-RENDER-APP-NAME.onrender.com/api/:splat"
#   status = 200
#   force = true

# HTTP Security and Cache Control Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
